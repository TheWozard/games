<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Games</title>
  <meta name="description" content="Simple puzzle games that work offline.">
  <meta name="theme-color" content="#16181d">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Games">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <script type="module" src="./shared/app.ts"></script>
  <style>
    .games { list-style: none; max-width: 520px; margin: 0 auto; padding: 0 16px 24px; display: grid; gap: 12px; }
    .game {
      display: flex; align-items: center; gap: 16px; padding: 16px;
      background: var(--surface); border: 1px solid var(--line); border-radius: 14px;
      color: inherit; text-decoration: none;
    }
    .game:active { background: var(--peer); }
    .game svg { flex: none; width: 48px; height: 48px; color: var(--accent); }
    .game strong { display: block; font-size: 1.1rem; }
    .game span { color: var(--muted); font-size: 0.95rem; }
  </style>
</head>
<body>
  <header class="bar"><h1>Games</h1></header>
  <ul class="games">
    <li>
      <a class="game" href="sudoku/">
        <svg viewBox="0 0 48 48" aria-hidden="true">
          <rect x="2" y="2" width="44" height="44" rx="8" fill="none" stroke="currentColor" stroke-width="3"/>
          <path d="M17 2v44M31 2v44M2 17h44M2 31h44" stroke="currentColor" stroke-width="2"/>
          <text x="9.5" y="14" font-size="10" font-weight="700" fill="currentColor" font-family="system-ui, sans-serif" text-anchor="middle">5</text>
          <text x="24" y="28" font-size="10" font-weight="700" fill="currentColor" font-family="system-ui, sans-serif" text-anchor="middle">3</text>
          <text x="38.5" y="42" font-size="10" font-weight="700" fill="currentColor" font-family="system-ui, sans-serif" text-anchor="middle">8</text>
        </svg>
        <div><strong>Sudoku</strong><span>Fill the grid so every row, column and box has 1–9.</span></div>
      </a>
    </li>
  </ul>
</body>
</html>
