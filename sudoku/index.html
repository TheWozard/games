<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Sudoku</title>
  <meta name="theme-color" content="#f6f5f2" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#16181d" media="(prefers-color-scheme: dark)">
  <link rel="manifest" href="../manifest.webmanifest">
  <link rel="icon" href="../icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="sudoku.css">
</head>
<body>
  <header class="bar">
    <a class="back" href="../">‹ Games</a>
    <h1>Sudoku <small id="difficulty"></small></h1>
    <span class="timer" id="timer" aria-label="Time">0:00</span>
  </header>

  <main class="sudoku">
    <div class="board" id="board" aria-label="Sudoku board"></div>
    <div class="tools">
      <button type="button" class="btn" id="undo">Undo</button>
      <button type="button" class="btn" id="erase">Erase</button>
      <button type="button" class="btn" id="notes" aria-pressed="false">Notes</button>
      <button type="button" class="btn" id="new">New</button>
    </div>
    <div class="pad" id="pad"></div>
  </main>

  <dialog id="new-dialog">
    <form method="dialog">
      <h2>New game</h2>
      <p id="new-warning">This replaces the game in progress.</p>
      <button class="btn" value="easy">Easy</button>
      <button class="btn" value="medium">Medium</button>
      <button class="btn" value="hard">Hard</button>
      <button class="btn" value="">Cancel</button>
    </form>
  </dialog>

  <dialog id="win-dialog">
    <form method="dialog">
      <h2>Solved!</h2>
      <p id="win-text"></p>
      <button class="btn primary" value="new">New game</button>
      <button class="btn" value="">Close</button>
    </form>
  </dialog>

  <script src="../js/app.js"></script>
  <script src="sudoku.js"></script>
</body>
</html>
