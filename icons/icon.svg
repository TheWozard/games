<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Full-bleed background; the tiles stay inside the maskable safe zone (central 80%). -->
  <rect width="512" height="512" fill="#2f6bd8"/>
  <g fill="#ffffff">
    <rect x="120" y="120" width="80" height="80" rx="14"/>
    <rect x="216" y="120" width="80" height="80" rx="14" opacity="0.3"/>
    <rect x="312" y="120" width="80" height="80" rx="14" opacity="0.3"/>
    <rect x="120" y="216" width="80" height="80" rx="14" opacity="0.3"/>
    <rect x="216" y="216" width="80" height="80" rx="14"/>
    <rect x="312" y="216" width="80" height="80" rx="14" opacity="0.3"/>
    <rect x="120" y="312" width="80" height="80" rx="14" opacity="0.3"/>
    <rect x="216" y="312" width="80" height="80" rx="14" opacity="0.3"/>
    <rect x="312" y="312" width="80" height="80" rx="14"/>
  </g>
</svg>
